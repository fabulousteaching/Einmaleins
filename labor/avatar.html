<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Teilmal – Avatar-Labor (Prototyp)</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="avatar-lab.css?v=1">
</head>
<body>
  <header class="lab-top">
    <a class="lab-brand" href="../"><img src="../icon.svg" alt=""><b><span class="teil">Teil</span><span class="mal">mal</span></b></a>
    <span class="lab-title">Avatar-Labor <small>Prototyp – noch nicht im Shop</small></span>
  </header>
  <main class="lab">
    <section class="lab-stage" id="stage" aria-label="Dein Avatar">
      <div class="lab-perf" id="perf" aria-hidden="true"></div>
      <div class="lab-anims" id="anims" role="group" aria-label="Bewegungen"></div>
      <p class="lab-hint">Drehen: ziehen · Zoomen: zwei Finger oder Mausrad · Doppeltippen: hüpfen</p>
      <p class="lab-nogl" id="nogl" hidden>Dieses Gerät kann leider keine 3D-Grafik anzeigen.</p>
    </section>
    <section class="lab-panel">
      <nav class="lab-tabs" id="tabs" role="tablist"></nav>
      <div class="lab-opts" id="opts"></div>
      <div class="lab-actions">
        <button class="lab-btn" id="rnd">🎲 Zufall</button>
        <button class="lab-btn ghost" id="reset">↩︎ Zurücksetzen</button>
      </div>
    </section>
  </main>
  <script src="../js/avatar3d.js?v=1"></script>
  <script type="module" src="avatar-lab.js?v=1"></script>
</body>
</html>
